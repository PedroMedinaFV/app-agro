services:
  postgres:
    image: postgres:16
    container_name: agro-app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agroapp
    ports:
      - "5432:5432"
    volumes:
      - agro_app_postgres_data:/var/lib/postgresql/data

volumes:
  agro_app_postgres_data:
